<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Sucesión de Fibonacci</title>
</head>
<body>

        <h1>Programa para Sucesión de Fibonacci</h1>

        </div>
    </div>
    <script src="index.js"></script>

</html>
